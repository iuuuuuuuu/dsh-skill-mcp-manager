name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v1.4.0)
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: node -e "const fs=require('node:fs'); const version=JSON.parse(fs.readFileSync('package.json','utf8')).version; if(process.env.RELEASE_TAG!=='v'+version) throw new Error('Release tag and package version differ');"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Check syntax
        run: |
          node --check lib/index.js
          node --check lib/mcp-config.js
          node --check lib/mcp-result.js
          node --check lib/oauth.js
          node --check lib/orphans.js
          node --check lib/session-audit.js
          node --check lib/skill.js
          node --check lib/skill-groups.js
          node --check lib/skills-import.js
          node --check lib/stdio-transport.js
          node --check lib/ui.js
          node --check lib/workspace-mcp.js
          node --check lib/child-env.js
          node --check client/client.js

      - name: Run tests
        run: |
          node test/smoke.mjs
          node test/schema-check.mjs
          node test/skill-smoke.mjs
          node test/watcher-smoke.mjs
          node test/import-smoke.mjs
          node test/ui-smoke.mjs
          node test/frontmatter-smoke.mjs
          node test/catalog-smoke.mjs
          node test/tool-disable-smoke.mjs
          node test/session-isolate-smoke.mjs
          node test/mcp-call-guard-smoke.mjs
          node test/mcp-result-smoke.mjs
          node test/mcp-load-schema-smoke.mjs
          node test/mcp-check-smoke.mjs
          node test/mcp-add-smoke.mjs
          node test/mcp-config-smoke.mjs
          node test/order-smoke.mjs
          node test/oauth-smoke.mjs
          node test/client-slots-smoke.mjs
          node test/client-render-smoke.mjs
          node test/capability-edit-smoke.mjs
          node test/skill-group-smoke.mjs
          node test/skills-import-smoke.mjs
          node test/skill-route-smoke.mjs
          node test/workspace-mcp-smoke.mjs
          node test/mcp-native-smoke.mjs
          node test/orphan-cleanup-smoke.mjs
          node test/session-caps-smoke.mjs
          node test/session-audit-smoke.mjs
          node test/security-smoke.mjs
          node test/stdio-transport-smoke.mjs

      - name: Publish
        run: npm publish --provenance --access public
